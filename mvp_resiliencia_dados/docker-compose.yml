services:
  minio:
    image: quay.io/minio/minio:latest
    container_name: mackenzie-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    restart: unless-stopped

  minio-init:
    image: quay.io/minio/mc:latest
    container_name: mackenzie-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}; do sleep 2; done;
      mc mb local/${MINIO_BUCKET_RAW} --ignore-existing;
      mc mb local/${MINIO_BUCKET_PROCESSED} --ignore-existing;
      mc mb local/${MINIO_BUCKET_CURATED} --ignore-existing;
      echo 'Buckets criados.';
      "

volumes:
  minio_data:
